<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>طريقة التواصل | QMISHI NUMBERS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>
    <div class="cursor"></div><div class="cursor-follower"></div>
    <div class="login-container">
        <div class="glass-panel p-5 text-center" style="max-width: 500px; width: 90%;">
            <h3 class="neon-text mb-2">اختر طريقة التواصل</h3>
            <p class="text-white-50 mb-4">لطلب رقم في: <span id="selectedCountry" class="text-warning fw-bold"></span></p>

            <div class="d-grid gap-3">
                <button onclick="selectMethod('whatsapp')" class="btn btn-lg" style="background: #25D366; color: white; border: none;">
                    <i class="fab fa-whatsapp me-2"></i> WhatsApp
                </button>
                <button onclick="selectMethod('telegram')" class="btn btn-lg" style="background: #0088cc; color: white; border: none;">
                    <i class="fab fa-telegram me-2"></i> Telegram
                </button>
                <button onclick="selectMethod('messenger')" class="btn btn-lg" style="background: #006AFF; color: white; border: none;">
                    <i class="fab fa-facebook-messenger me-2"></i> Messenger
                </button>
            </div>
        </div>
    </div>

    <script type="module">
        const urlParams = new URLSearchParams(window.location.search);
        const country = urlParams.get('country') || 'غير محدد';
        document.getElementById('selectedCountry').textContent = country;

        window.selectMethod = (method) => {
            if (method === 'whatsapp') {
                Swal.fire({
                    title: 'تأكيد الإرسال عبر واتساب',
                    html: `سيتم فتح واتساب على الرقم:<br><strong class="text-warning">+967783916451</strong>`,
                    icon: 'info',
                    showCancelButton: true,
                    confirmButtonColor: '#25D366',
                    cancelButtonColor: '#d33',
                    confirmButtonText: 'التالي',
                    cancelButtonText: 'إلغاء'
                }).then((result) => {
                    if (result.isConfirmed) {
                        const message = encodeURIComponent(`السلام عليكم\nلقد اخترت الدولة: ${country}\nوأرغب بطلب رقم وهمي.`);
                        window.open(`https://wa.me/967783916451?text=${message}`, '_blank');
                    }
                });
            } else {
                Swal.fire('قريباً', 'هذا الخيار قيد التفعيل من قبل الأدمن', 'info');
            }
        };
    </script>
    <script src="js/main.js"></script>
</body>
</html>
