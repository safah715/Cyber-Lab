<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول | QMISHI NUMBERS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/login.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>
    <div class="cursor"></div>
    <div class="cursor-follower"></div>
    <div id="loader"><div class="loader-spinner"></div><h3 class="mt-3 neon-text">QMISHI NUMBERS</h3></div>

    <div class="login-container">
        <div class="login-bg" id="loginBg" style="background-image: url('assets/images/login-bg.jpg');"></div>
        
        <div class="glass-panel login-box text-center">
            <img src="assets/icons/logo.png" alt="Logo" width="80" class="mb-3">
            <h2 class="neon-text mb-2">QMISHI NUMBERS</h2>
            <p class="text-white-50 mb-4">بوابتك العالمية للأرقام المميزة</p>

            <form id="loginForm" class="text-start">
                <div class="mb-3">
                    <label class="text-white-50 small">البريد الإلكتروني</label>
                    <input type="email" id="email" class="form-control form-control-glass" required>
                </div>
                <div class="mb-3">
                    <label class="text-white-50 small">كلمة المرور</label>
                    <input type="password" id="password" class="form-control form-control-glass" required>
                </div>
                <div class="d-flex justify-content-between mb-4 small">
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="remember">
                        <label class="form-check-label text-white-50" for="remember">تذكرني</label>
                    </div>
                    <a href="#" class="text-decoration-none" style="color: var(--gold);" onclick="resetPassword()">نسيت كلمة المرور؟</a>
                </div>
                <button type="submit" class="btn btn-gold w-100 mb-3">تسجيل الدخول</button>
            </form>

            <div class="d-flex align-items-center my-3">
                <hr class="flex-grow-1 border-secondary">
                <span class="px-3 text-white-50 small">أو</span>
                <hr class="flex-grow-1 border-secondary">
            </div>

            <button class="btn btn-outline-light w-100 mb-3 rounded-pill" onclick="googleLogin()">
                <i class="fab fa-google me-2" style="color: #DB4437;"></i> الدخول عبر Google
            </button>

            <p class="text-center text-white-50 small mb-0">
                ليس لديك حساب؟ <a href="register.html" class="text-decoration-none" style="color: var(--gold);">إنشاء حساب جديد</a>
            </p>
        </div>
    </div>

    <script type="module">
        import { handleEmailLogin, handleGoogleLogin } from './js/auth.js';
        window.googleLogin = handleGoogleLogin;
        
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            await handleEmailLogin(email, password);
        });

        window.resetPassword = async () => {
            const { value: email } = await Swal.fire({
                title: 'استعادة كلمة المرور',
                input: 'email',
                inputLabel: 'أدخل بريدك الإلكتروني',
                inputPlaceholder: 'name@example.com',
                background: '#1a1a1a',
                color: '#fff',
                confirmButtonColor: '#D4AF37'
            });
            if (email) {
                Swal.fire('تم', 'تم إرسال رابط الاستعادة إلى بريدك', 'success');
            }
        };

        window.addEventListener('load', () => {
            document.getElementById('loader').style.display = 'none';
        });
    </script>
    <script src="js/main.js"></script>
</body>
</html>
